name: Validate PR branch

on:
  push:
    branches:
      - codex/client-application-gui-authorization

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build TextBase2.slnx --configuration Release
